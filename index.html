<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="bg-light">
    <main class="container py-4 py-md-5">
      <div class="row justify-content-center g-4">
        <section class="col-12 col-md-6 col-lg-4" aria-labelledby="titulo-calculadora">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 id="titulo-calculadora" class="h4 text-center mb-4">Calculadora</h1>

              <div id="visor" class="form-control form-control-lg text-end mb-3" aria-live="polite">0</div>

              <div class="d-grid gap-2">
                <div class="row g-2">
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="7">7</button></div>
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="8">8</button></div>
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="9">9</button></div>
                  <div class="col-3"><button class="btn btn-outline-primary btn-lg w-100" type="button" data-operador="/">/</button></div>
                </div>
                <div class="row g-2">
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="4">4</button></div>
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="5">5</button></div>
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="6">6</button></div>
                  <div class="col-3"><button class="btn btn-outline-primary btn-lg w-100" type="button" data-operador="*">*</button></div>
                </div>
                <div class="row g-2">
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="1">1</button></div>
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="2">2</button></div>
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="3">3</button></div>
                  <div class="col-3"><button class="btn btn-outline-primary btn-lg w-100" type="button" data-operador="-">-</button></div>
                </div>
                <div class="row g-2">
                  <div class="col-3"><button class="btn btn-danger btn-lg w-100" id="limpar" type="button">C</button></div>
                  <div class="col-3"><button class="btn btn-outline-secondary btn-lg w-100 numero" type="button" data-numero="0">0</button></div>
                  <div class="col-3"><button class="btn btn-outline-primary btn-lg w-100" id="igual" type="button">=</button></div>
                  <div class="col-3"><button class="btn btn-outline-primary btn-lg w-100" type="button" data-operador="+">+</button></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside class="col-12 col-md-6 col-lg-4" aria-labelledby="titulo-historico">
          <div class="card shadow-sm historico-card">
            <div class="card-body">
              <h2 id="titulo-historico" class="h5">Histórico</h2>
              <p id="historico-vazio" class="text-body-secondary mb-0">Nenhuma entrada registrada.</p>
              <ul id="historico" class="list-group list-group-flush historico-lista"></ul>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
